<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#142b30"><meta name="description" content="依据两张实拍图细化白鹤滩两岸分层弯折挡墙、裸岩、锚固和水岸交界的 Three.js 三维场景。">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
  // 双击本地 HTML 时显示启动指引；模块和共享模型由本机服务加载。
  if(location.protocol==='file:')location.replace('./白鹤滩-坝库一体场景.html'+location.search+location.hash);
  // 独立兜底：即使主程序因内核过旧/内存不足而未启动，加载页也不会永久黑屏。
  window.__baihetanWatchdog=setTimeout(function(){
    if(window.__APP_READY__)return;
    var el=document.getElementById('loading');if(!el)return;
    var ua=navigator.userAgent,old=/(CPU OS [0-9]|Android [0-7])\b/.test(ua);
    el.innerHTML='<strong>三维场景加载超时</strong><small>'+(old?'当前系统版本过低，请升级微信/QQ或换用 Chrome 打开':'可能内存不足，请关闭后台网页后重试')+'</small><button onclick="location.reload()" style="margin-top:14px;padding:10px 22px;background:#304f40;color:#eff1d5;border:0;border-radius:3px">重新加载</button>';
  },90000);
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  document.addEventListener('gesturechange',function(e){e.preventDefault();});
  </script>
  <title>白鹤滩 · 大坝与库区一体场景</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142b30'/%3E%3Cpath d='M12 17 Q32 39 52 17 L47 48 Q32 57 17 48Z' fill='%23e4e4cd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <div id="viewport"><canvas id="scene" aria-label="可旋转的白鹤滩水电站三维场景"></canvas><div id="labels"></div></div>
  <div id="loading"><span class="spinner"></span><strong>正在构建峡谷与拱坝</strong></div>
  <div id="restart-overlay"><strong id="restart-title">3D 渲染已中断</strong><small id="restart-sub" style="opacity:.7">通常是设备内存不足导致，点击下方按钮可恢复。</small><button onclick="location.reload()">重新加载场景</button></div>
  <header class="ui masthead"><h1>白鹤滩</h1></header>
  <div class="ui top-actions"><button id="panel-toggle" class="panel-toggle">控制 ☰</button></div>
  <div id="panel-backdrop"></div>
  <button id="clean-view" title="隐藏或显示界面（H）">净览 <span>H</span></button>
  <aside class="ui control-panel" aria-label="场景控制">
    <div class="panel-heading"><span class="live-dot"></span>观察场景 <span class="panel-index">LIVE 3D</span></div>
    <button id="powerhouse-button" class="primary">进入电站内部 ↗</button>
    <div class="view-list" role="group" aria-label="主要视角">
      <button class="view active" data-view="engineering">电站全景</button>
      <button class="view" data-view="upstream">上游水库</button>
      <button class="view" data-view="park">滨水公园</button>
      <button class="view" data-view="overhead">坝顶俯瞰</button>
    </div>
    <div class="options">
      <label><span>泄洪</span><input id="toggle-flow" type="checkbox"><span class="switch"></span></label>
      <label><span>水面微动</span><input id="toggle-water" type="checkbox" checked><span class="switch"></span></label>
      <label class="quality-label"><span>画质</span><select id="quality" aria-label="画质"><option value="low">流畅</option><option value="medium">均衡</option><option value="high" selected>精细</option></select></label>
    </div>
    <button id="walk-button" class="secondary">第一人称漫游</button>

  </aside>

  <footer class="ui bottom-bar">
    <div class="tools"><button id="pause-button" title="暂停或恢复全部动画（空格）">Ⅱ 暂停</button><button id="reset-button" title="恢复下游全景">↺ 重置</button><button id="capture-button" title="保存当前三维画面 PNG">↓ 截图</button></div>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
<div id="walk-selection" hidden><p id="walk-pick-message" role="status">点击选择起点</p><div><button id="confirm-walk" disabled>确定从光点出发</button><button id="cancel-walk">取消 Esc</button></div></div>
  <div id="walk-dot" hidden aria-label="选定的漫游起点"></div>
  <div id="walk-hud"><div class="crosshair">+</div><div class="walk-help"><span class="walk-desktop-help">↑↓←→ 移动 · 鼠标转头 · Shift＋左键按住固定视角 · Space 跳跃 / 上浮 · Shift 奔跑 · Ctrl 下潜</span><span class="walk-touch-help">按方向键移动 · 拖动画面转头</span> <button id="exit-walk">退出 Esc</button></div>
    <div class="walk-touch-controls" aria-label="触屏漫游控制">
      <div class="walk-direction-pad"><button data-walk-key="ArrowUp" aria-label="向前">↑</button><button data-walk-key="ArrowLeft" aria-label="向左">←</button><button data-walk-key="ArrowDown" aria-label="向后">↓</button><button data-walk-key="ArrowRight" aria-label="向右">→</button></div>
      <div class="walk-touch-actions"><button data-walk-key="Space">跳跃 / 上浮</button><button data-walk-key="ShiftLeft">奔跑</button><button data-walk-key="ControlLeft">下潜</button></div>
    </div>
  </div>
  <small class="creator-credit" aria-label="制作人员">Created by 段茜媛 · 蒋寒狄 · 刘子涵 · 罗惟伊 · 彭钰绚 · 王晨熙 · 王金涛 · 温子萱</small>
    <script type="module" src="src/main.js"></script>
</body>
</html>
